# The PinePhone keyboard case's drivers probe the same pogo-pin I2C bus the LoRa back cover
# uses (the keyboard at 0x15, its battery charger at 0x75). The keyboard case and the cover
# are both back attachments and cannot be mounted together, so with the cover on these two
# drivers only get in the way. Remove this file to use the keyboard case again.
blacklist pinephone_keyboard
blacklist ip5xxx_power
